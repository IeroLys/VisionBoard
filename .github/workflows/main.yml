name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Check TypeScript types
      run: npx tsc --noEmit
      
    - name: Run linter
      run: npm run lint
      continue-on-error: true  # Если линтера нет, не упадет
      
    - name: Run tests
      run: npm test
      continue-on-error: true  # Если тестов нет, не упадет
      
    - name: Build project
      run: npm run build
